<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Content Filter Review</title>
</head>
<body>
<div id="ContentFilterReviewPage" data-role="page" class="page type-interior"
     data-require="emby-input,emby-button">
    <div data-role="content">
        <div class="content-primary">
            <h1>Content Filter Review</h1>
            <p>Review candidate segments generated by the analysis daemon.</p>
            <div class="inputContainer">
                <label class="inputLabel inputLabelUnfocused" for="ReviewItemId">Jellyfin item ID</label>
                <input id="ReviewItemId" is="emby-input" type="text" required>
            </div>
            <button id="LoadCandidates" is="emby-button" class="raised button-submit">Load candidates</button>
            <div id="CandidateList"></div>
        </div>
    </div>
    <script>
        (() => {
            const page = document.querySelector('#ContentFilterReviewPage');
            const list = page.querySelector('#CandidateList');
            const value = (object, name) =>
                object?.[name] ?? object?.[name.charAt(0).toLowerCase() + name.slice(1)];

            function node(tag, text, className) {
                const result = document.createElement(tag);
                if (className) result.className = className;
                if (text !== undefined && text !== null) result.textContent = String(text);
                return result;
            }

            function labeledInput(labelText, type, initialValue, className) {
                const label = node('label', null, 'inputContainer');
                label.append(node('span', labelText, 'inputLabel inputLabelUnfocused'));
                const input = document.createElement('input');
                input.type = type;
                input.value = initialValue;
                input.className = className;
                if (type === 'number') {
                    input.min = '0';
                    input.step = '1';
                }
                label.append(input);
                return { label, input };
            }

            function labeledSelect(labelText, options, initialValue, className) {
                const label = node('label', null, 'selectContainer');
                label.append(node('span', labelText, 'selectLabel'));
                const select = document.createElement('select');
                select.className = className;
                for (const optionValue of options) {
                    const option = node('option', optionValue);
                    option.value = optionValue;
                    option.selected = optionValue === initialValue;
                    select.append(option);
                }
                label.append(select);
                return { label, select };
            }

            function evidenceNode(evidence) {
                const block = node('div', null, 'paperList padding1');
                const confidence = value(evidence, 'Confidence');
                const rawScore = value(evidence, 'RawScore');
                const score = rawScore ?? confidence;
                block.append(node(
                    'h4',
                    `${value(evidence, 'Source')} · ${value(evidence, 'Category')} / ${value(evidence, 'Severity')}`));
                block.append(node(
                    'p',
                    `${value(evidence, 'StartMilliseconds')}–${value(evidence, 'EndMilliseconds')} ms`
                    + (score === null || score === undefined ? '' : ` · score ${score}`)));

                const details = value(evidence, 'Details');
                if (details && typeof details === 'object') {
                    const transcript = details.transcript ?? details.text ?? details.transcription;
                    const model = details.model ?? details.model_name ?? details.modelName;
                    if (transcript !== undefined) block.append(node('p', `Transcript: ${transcript}`));
                    if (model !== undefined) block.append(node('p', `Model: ${model}`));
                    const raw = node('pre');
                    raw.textContent = JSON.stringify(details, null, 2);
                    block.append(raw);
                } else if (details !== undefined && details !== null) {
                    block.append(node('pre', details));
                }
                return block;
            }

            function candidateNode(candidate, evidenceById) {
                const interval = value(candidate, 'Interval');
                const candidateId = String(value(candidate, 'CandidateId'));
                const card = node('div', null, 'paperList padding1');
                card.dataset.id = candidateId;
                card.append(node(
                    'h3',
                    `${value(interval, 'Category')} · ${value(candidate, 'Status')}`));
                card.append(node('p', `Item ${value(candidate, 'MediaId')}`));

                const start = labeledInput(
                    'Start (ms)',
                    'number',
                    value(interval, 'StartMilliseconds'),
                    'editStart');
                const end = labeledInput(
                    'End (ms)',
                    'number',
                    value(interval, 'EndMilliseconds'),
                    'editEnd');
                const category = labeledInput(
                    'Category',
                    'text',
                    value(interval, 'Category'),
                    'editCategory');
                const action = labeledSelect(
                    'Action',
                    ['mute', 'skip'],
                    String(value(interval, 'Action')).toLowerCase(),
                    'editAction');
                const severity = labeledSelect(
                    'Severity',
                    ['low', 'medium', 'high', 'critical'],
                    String(value(interval, 'Severity')).toLowerCase(),
                    'editSeverity');
                card.append(start.label, end.label, category.label, action.label, severity.label);

                for (const decision of ['approve', 'reject', 'edit']) {
                    const button = node(
                        'button',
                        decision.charAt(0).toUpperCase() + decision.slice(1),
                        'raised btnDecision');
                    button.type = 'button';
                    button.dataset.decision = decision;
                    button.setAttribute('is', 'emby-button');
                    card.append(button);
                }

                const evidenceSection = node('div', null, 'candidateEvidence');
                evidenceSection.append(node('h4', 'Evidence'));
                const evidenceIds = value(candidate, 'EvidenceIds') ?? [];
                const associated = evidenceIds
                    .map(id => evidenceById.get(String(id).toLowerCase()))
                    .filter(Boolean);
                if (associated.length === 0) {
                    evidenceSection.append(node('p', 'No evidence is associated with this candidate.'));
                } else {
                    evidenceSection.append(...associated.map(evidenceNode));
                }
                card.append(evidenceSection);
                return card;
            }

            async function load() {
                const itemId = page.querySelector('#ReviewItemId').value.trim();
                if (!itemId) return;
                Dashboard.showLoadingMsg();
                try {
                    const encodedItem = encodeURIComponent(itemId);
                    const [candidates, evidence] = await Promise.all([
                        ApiClient.ajax({
                            url: ApiClient.getUrl(`/ContentFilter/review/${encodedItem}`),
                            dataType: 'json'
                        }),
                        ApiClient.ajax({
                            url: ApiClient.getUrl(`/ContentFilter/review/${encodedItem}/evidence`),
                            dataType: 'json'
                        })
                    ]);
                    const evidenceById = new Map(
                        evidence.map(entry => [String(value(entry, 'Id')).toLowerCase(), entry]));
                    list.replaceChildren(...(candidates.length
                        ? candidates.map(candidate => candidateNode(candidate, evidenceById))
                        : [node('p', 'No candidates are waiting for review.')]));
                } catch (error) {
                    list.replaceChildren(node('p', `Unable to load review data: ${error.message ?? error}`));
                } finally {
                    Dashboard.hideLoadingMsg();
                }
            }

            list.addEventListener('click', async event => {
                const button = event.target.closest('.btnDecision');
                if (!button) return;
                const candidate = button.closest('[data-id]');
                const decision = button.dataset.decision;
                const request = { Decision: decision };
                if (decision === 'edit') {
                    const start = Number(candidate.querySelector('.editStart').value);
                    const end = Number(candidate.querySelector('.editEnd').value);
                    const category = candidate.querySelector('.editCategory').value.trim();
                    if (!Number.isSafeInteger(start) || !Number.isSafeInteger(end)
                        || start < 0 || end <= start || !category) {
                        window.alert('Enter a category and a valid interval whose end is after its start.');
                        return;
                    }
                    request.Edit = {
                        StartMilliseconds: start,
                        EndMilliseconds: end,
                        Action: candidate.querySelector('.editAction').value,
                        Category: category,
                        Severity: candidate.querySelector('.editSeverity').value
                    };
                }
                button.disabled = true;
                try {
                    await ApiClient.ajax({
                        url: ApiClient.getUrl(
                            `/ContentFilter/review/${encodeURIComponent(page.querySelector('#ReviewItemId').value.trim())}/${candidate.dataset.id}`),
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(request)
                    });
                    candidate.remove();
                } finally {
                    button.disabled = false;
                }
            });

            page.querySelector('#LoadCandidates').addEventListener('click', load);
        })();
    </script>
</div>
</body>
</html>
